<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="Tahoma,Verdana,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#333"/>
    </marker>
  </defs>
  <rect width="880" height="330" fill="#fff"/>

  <!-- process boundaries -->
  <rect x="150" y="30" width="190" height="170" fill="#fdecea" stroke="#c0392b" stroke-dasharray="5 4"/>
  <text x="160" y="48" font-size="11" fill="#c0392b" font-weight="700">PROCESS 1 · RECORDER</text>
  <text x="160" y="62" font-size="10" fill="#c0392b">standard library only</text>

  <rect x="400" y="30" width="190" height="170" fill="#eaf1fb" stroke="#2c5aa0" stroke-dasharray="5 4"/>
  <text x="410" y="48" font-size="11" fill="#2c5aa0" font-weight="700">PROCESS 2 · INGEST</text>
  <text x="410" y="62" font-size="10" fill="#2c5aa0">idempotent, re-runnable</text>

  <rect x="650" y="30" width="200" height="170" fill="#eaf7ee" stroke="#2e8b57" stroke-dasharray="5 4"/>
  <text x="660" y="48" font-size="11" fill="#2e8b57" font-weight="700">PROCESS 3 · SERVE</text>
  <text x="660" y="62" font-size="10" fill="#2e8b57">read-only (+ confirmed delete)</text>

  <!-- game -->
  <rect x="20" y="90" width="100" height="56" rx="4" fill="#222"/>
  <text x="70" y="114" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">F1 23</text>
  <text x="70" y="132" font-size="10" fill="#bbb" text-anchor="middle">UDP :20777, 60 Hz</text>

  <!-- recorder -->
  <rect x="170" y="90" width="150" height="56" rx="4" fill="#fff" stroke="#333"/>
  <text x="245" y="112" font-size="12" text-anchor="middle" font-weight="700">recv → append</text>
  <text x="245" y="130" font-size="10" fill="#555" text-anchor="middle">no parsing, no DB, no UI</text>

  <!-- ingest -->
  <rect x="420" y="80" width="150" height="76" rx="4" fill="#fff" stroke="#333"/>
  <text x="495" y="100" font-size="12" text-anchor="middle" font-weight="700">decode → laps</text>
  <text x="495" y="116" font-size="10" fill="#555" text-anchor="middle">parsers by (format, id, ver)</text>
  <text x="495" y="130" font-size="10" fill="#555" text-anchor="middle">validity rule, stints</text>
  <text x="495" y="144" font-size="10" fill="#555" text-anchor="middle">1 m distance grid</text>

  <!-- serve -->
  <rect x="670" y="80" width="160" height="76" rx="4" fill="#fff" stroke="#333"/>
  <text x="750" y="100" font-size="12" text-anchor="middle" font-weight="700">FastAPI + React</text>
  <text x="750" y="116" font-size="10" fill="#555" text-anchor="middle">DuckDB over Parquet</text>
  <text x="750" y="130" font-size="10" fill="#555" text-anchor="middle">library, pace, compare</text>
  <text x="750" y="144" font-size="10" fill="#555" text-anchor="middle">127.0.0.1:8420</text>

  <!-- storage -->
  <path d="M190 240a55 10 0 0 0 110 0v50a55 10 0 0 1-110 0z" fill="#fff" stroke="#333"/>
  <ellipse cx="245" cy="240" rx="55" ry="10" fill="#f7f7f7" stroke="#333"/>
  <text x="245" y="270" font-size="11" text-anchor="middle" font-weight="700">raw\ *.f1raw</text>
  <text x="245" y="285" font-size="9" fill="#555" text-anchor="middle">system of record</text>

  <path d="M440 240a55 10 0 0 0 110 0v50a55 10 0 0 1-110 0z" fill="#fff" stroke="#333"/>
  <ellipse cx="495" cy="240" rx="55" ry="10" fill="#f7f7f7" stroke="#333"/>
  <text x="495" y="270" font-size="11" text-anchor="middle" font-weight="700">derived\ Parquet</text>
  <text x="495" y="285" font-size="9" fill="#555" text-anchor="middle">regenerable</text>

  <!-- arrows -->
  <line x1="120" y1="118" x2="168" y2="118" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="245" y1="146" x2="245" y2="228" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="252" y="195" font-size="10" fill="#555">every datagram,</text>
  <text x="252" y="207" font-size="10" fill="#555">verbatim</text>
  <path d="M300 265 C 350 265, 360 140, 418 125" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="495" y1="156" x2="495" y2="228" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M550 265 C 610 265, 620 140, 668 125" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="660" y="250" font-size="10" fill="#555">Delete the derived store and</text>
  <text x="660" y="264" font-size="10" fill="#555">re-run ingest: identical output.</text>
  <text x="660" y="278" font-size="10" fill="#555">Raw logs keep every past session</text>
  <text x="660" y="292" font-size="10" fill="#555">re-analysable by future parsers.</text>
</svg>
